successMessage: The RoleBinding does not reference the default cluster-admin ClusterRole or one with wildcard permissions
failureMessage: The RoleBinding references the default cluster-admin ClusterRole or one with wildcard permissions
category: Security
target: rbac.authorization.k8s.io/RoleBinding
schemaString: |
  '$schema': https://json-schema.org/draft/2019-09/schema
  type: object
  anyOf:
    # Pass RoleBindings that point to a Role.
    - required: ["roleRef"]
      properties:
        roleRef:
          required: ["kind"]
          properties:
            kind:
              type: string
              const: "Role"
    # Do not alert on default ClusterRoleBindings.
    - required: ["metadata"]
      properties:
        metadata:
          type: object
          required: ["name"]
          properties:
            name:
              type: string
              anyOf:
                - pattern: '^system:'
                - const: "gce:podsecuritypolicy:calico-sa"
    - required: ["roleRef"]
      properties:
        roleRef:
          required: ["apiGroup", "kind", "name"]
          properties:
            apiGroup:
              type: string
              const: "rbac.authorization.k8s.io"
            kind:
              type: string
              const: "ClusterRole"
            name:
              type: string
              minLength: 1
              not:
                const: "cluster-admin"
additionalSchemaStrings:
  rbac.authorization.k8s.io/ClusterRole: |
    {{ if eq .roleRef.kind "ClusterRole" }}
    {{ if and (not (hasPrefix .metadata.name "system:")) (ne .metadata.name "gce:podsecuritypolicy:calico-sa") }}
    # This schema is validated for all roleBindings, regardless of their roleRef.
    type: object
    required: ["metadata", "rules"]
    allOf:
      - properties:
          metadata:
            required: ["name"]
            properties:
              name:
                type: string
                const: "{{ .roleRef.name }}"
      - properties:
          rules:
            type: array
            items:
              type: object
              not:
                required: ["apiGroups", "resources", "verbs"]
                properties:
                  apiGroups:
                    type: array
                    contains:
                      type: string
                      const: "*"
                  resources:
                    type: array
                    contains:
                      type: string
                      const: '*'
                  verbs:
                    type: array
                    anyOf:
                      - contains:
                          type: string
                          const: '*'
                      # All seven verbs count as a wildcard, with or without others such as deletecollection.
                      - allOf:
                          - contains:
                              const: "get"
                          - contains:
                              const: "list"
                          - contains:
                              const: "watch"
                          - contains:
                              const: "create"
                          - contains:
                              const: "update"
                          - contains:
                              const: "patch"
                          - contains:
                              const: "delete"
    {{ end }}
    {{ end }}
