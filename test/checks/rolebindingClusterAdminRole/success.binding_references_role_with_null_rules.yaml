# This succeeds because the referenced Role has null rules, which grant nothing.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: no-rules
  namespace: test
rules:
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: no-rules
  namespace: test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: no-rules
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: User
  name: testuser
