apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: plaintext
  namespace: app
spec:
  parentRefs:
  - name: public
    namespace: infra
    sectionName: http
  hostnames:
  - app.example.com
  rules:
  - backendRefs:
    - name: app
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: infra
spec:
  gatewayClassName: kgateway
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: All
