apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: secure-backend
  namespace: app
spec:
  hostnames:
  - app.example.com
  rules:
  - backendRefs:
    - name: api
      port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: api-tls
  namespace: app
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: api
  validation:
    hostname: api.app.svc.cluster.local
    wellKnownCACertificates: System
